<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>영화 티어리스트 메이커</title>
    <style>
        :root {
            --bg-color: #141414;
            --container-bg: #222222;
            --text-color: #e5e5e5;
            --border-color: #333333;
            --highlight: #e50914; /* 넷플릭스 레드 느낌 */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            padding-bottom: 80px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        /* 국가 필터 영역 */
        .country-filter-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            scrollbar-width: none; /* Firefox */
        }
        .country-filter-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #444;
            background-color: #333;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        
        .filter-btn.active {
            background-color: var(--highlight);
            border-color: var(--highlight);
            font-weight: bold;
        }

        .suggest-country-btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px dashed #666;
            background-color: transparent;
            color: #aaa;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        /* 검색 영역 */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .search-container input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #333;
            color: white;
            font-size: 1rem;
        }
        
        .search-container button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background-color: var(--highlight);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* 티어보드 영역 */
        .tier-board {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background-color: var(--bg-color);
            border: 2px solid #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .tier-row {
            display: flex;
            min-height: 100px;
            background-color: var(--container-bg);
            border-bottom: 2px solid #000;
        }
        .tier-row:last-child {
            border-bottom: none;
        }

        .tier-label {
            width: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #111;
            cursor: pointer;
            text-align: center;
            word-break: break-all;
            padding: 5px;
            flex-shrink: 0;
            border-right: 2px solid #000;
        }

        .tier-movies {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px;
        }

        /* 대기열 (검색 결과) */
        .pool-container {
            background-color: var(--container-bg);
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
        }
        
        .pool-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .movie-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* 영화 아이템 */
        .movie-item {
            width: 80px;
            height: 120px;
            background-color: #444;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            position: relative;
            background-size: cover;
            background-position: center;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .movie-item:hover {
            border-color: white;
        }
        
        .movie-title-fallback {
            padding: 5px;
            font-size: 0.75rem;
            text-align: center;
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
            word-break: break-all;
        }
        
        .country-badge {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 0.6rem;
            text-align: center;
            padding: 2px 0;
        }

        /* 모달 공통 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: var(--container-bg);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            align-self: flex-end;
            font-size: 1.5rem;
            margin-top: -30px;
        }

        /* 티어 선택 모달 버튼 */
        .tier-select-btn {
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-size: 1.1rem;
            font-weight: bold;
            color: #111;
            cursor: pointer;
            margin-bottom: 5px;
        }
        .remove-tier-btn {
            background-color: #444;
            color: white;
        }

        /* 폼 요소 */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.9rem;
            color: #aaa;
        }
        .form-group input, .form-group textarea, .form-group select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #333;
            color: white;
            font-family: inherit;
        }
        .form-group textarea {
            resize: none;
            height: 80px;
        }

        .btn-primary {
            background-color: var(--highlight);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        
        /* 알림 메시지 (토스트) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 0.9rem;
            border: 1px solid #555;
        }

        #toast.show {
            visibility: visible;
            -webkit-animation: fadein 0.5s, fadeout 0.5s 2.5s;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @-webkit-keyframes fadein {
            from {bottom: 0; opacity: 0;} 
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @-webkit-keyframes fadeout {
            from {bottom: 30px; opacity: 1;} 
            to {bottom: 0; opacity: 0;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
        
        /* 유틸 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>🎬 나의 영화 티어리스트</h1>

    <!-- 국가 필터 영역 -->
    <div class="country-filter-container" id="countryFilters">
        <button class="filter-btn active" onclick="setCountryFilter('ALL')">전체</button>
        <button class="filter-btn" onclick="setCountryFilter('KR')">한국</button>
        <button class="filter-btn" onclick="setCountryFilter('US')">미국</button>
        <button class="filter-btn" onclick="setCountryFilter('GB')">영국</button>
        <button class="filter-btn" onclick="setCountryFilter('JP')">일본</button>
        <button class="filter-btn" onclick="setCountryFilter('CN')">중국</button>
        <button class="filter-btn" onclick="setCountryFilter('TW')">대만</button>
        <button class="suggest-country-btn" onclick="openCountrySuggestModal()">+ 국가 건의</button>
    </div>

    <!-- 검색 영역 -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="영화 제목 검색 (예: 기생충, 인셉션)">
        <button onclick="searchMovie()">검색</button>
    </div>

    <!-- 티어 보드 -->
    <div class="tier-board" id="tierBoard">
        <!-- JS로 렌더링 됨 -->
    </div>

    <!-- 대기열 -->
    <div class="pool-container">
        <div class="pool-title">
            <span>대기열</span>
            <span id="currentFilterLabel" style="font-size: 0.8rem;">필터: 전체</span>
        </div>
        <div class="movie-list" id="moviePool">
            <!-- JS로 렌더링 됨 -->
        </div>
    </div>

    <!-- 1. 티어 선택 모달 (대기열에서 영화 클릭 시) -->
    <div class="modal-overlay" id="tierSelectModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('tierSelectModal')">&times;</button>
            <div class="modal-title" id="tierSelectTitle">어느 티어에 배치할까요?</div>
            <div id="tierSelectButtons" style="display: flex; flex-direction: column; gap: 8px;">
                <!-- JS로 렌더링 됨 -->
            </div>
        </div>
    </div>

    <!-- 2. 상세 평가 모달 (티어보드에서 영화 클릭 시) -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('reviewModal')">&times;</button>
            <div class="modal-title" id="reviewMovieTitle">영화 상세 평가</div>
            
            <div class="form-group">
                <label>별점 (5점 만점)</label>
                <select id="reviewRating">
                    <option value="5">⭐⭐⭐⭐⭐ (5점 - 최고!)</option>
                    <option value="4">⭐⭐⭐⭐ (4점 - 훌륭함)</option>
                    <option value="3">⭐⭐⭐ (3점 - 볼만함)</option>
                    <option value="2">⭐⭐ (2점 - 아쉬움)</option>
                    <option value="1">⭐ (1점 - 별로임)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>추천 대상</label>
                <input type="text" id="reviewTarget" placeholder="예: 킬링타임용, 연인과 함께, 마블 팬 등">
            </div>

            <div class="form-group">
                <label>한 줄 평</label>
                <textarea id="reviewComment" placeholder="영화에 대한 짧은 감상을 남겨주세요."></textarea>
            </div>

            <button class="btn-primary" onclick="saveReview()">저장하기</button>
            <button class="btn-primary" style="background-color: #444; margin-top: 0;" onclick="moveToPool()">대기열로 내리기</button>
        </div>
    </div>

    <!-- 3. 티어 편집 모달 (티어 라벨 클릭 시) -->
    <div class="modal-overlay" id="tierEditModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('tierEditModal')">&times;</button>
            <div class="modal-title">티어 설정</div>
            
            <div class="form-group">
                <label>티어 이름</label>
                <input type="text" id="editTierName">
            </div>
            
            <div class="form-group">
                <label>배경 색상</label>
                <input type="color" id="editTierColor" style="height: 40px; padding: 2px;">
            </div>

            <button class="btn-primary" onclick="saveTierEdit()">적용</button>
        </div>
    </div>

    <!-- 4. 국가 건의 모달 -->
    <div class="modal-overlay" id="countrySuggestModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('countrySuggestModal')">&times;</button>
            <div class="modal-title">새로운 국가 건의하기</div>
            
            <div style="font-size: 0.9rem; color: #ccc; margin-bottom: 10px; line-height: 1.4;">
                원하시는 국가가 없나요? 아래에 입력해 주시면 많은 분들이 요청한 국가부터 탭에 추가해 드립니다!
            </div>

            <div class="form-group">
                <label>추가하고 싶은 국가명</label>
                <input type="text" id="suggestCountryInput" placeholder="예: 프랑스, 인도 등">
            </div>

            <button class="btn-primary" onclick="submitCountrySuggest()">건의 보내기</button>
        </div>
    </div>

    <!-- 알림용 토스트 -->
    <div id="toast">메시지</div>

    <script>
        // 초기 데이터 상태
        let tiers = [
            { id: 'tier-s', name: 'S', color: '#ff7f7f' },
            { id: 'tier-a', name: 'A', color: '#ffb37f' },
            { id: 'tier-b', name: 'B', color: '#ffd27f' },
            { id: 'tier-c', name: 'C', color: '#ffff7f' },
            { id: 'tier-d', name: 'D', color: '#7fff7f' }
        ];

        // 영화 데이터 저장 배열 { id, title, poster, tierId, rating, target, comment, country }
        let movies = []; 

        // 현재 선택된 필터 (기본: 전체)
        let currentCountryFilter = 'ALL';

        // 국가 코드 매핑
        const countryMap = {
            'KR': '한국', 'US': '미국', 'GB': '영국',
            'JP': '일본', 'CN': '중국', 'TW': '대만', 'ALL': '전체'
        };

        // 현재 조작 중인 영화/티어 ID
        let currentSelectedMovieId = null;
        let currentSelectedTierId = null;

        // 초기화
        function init() {
            renderTiers();
            renderPool();
        }

        /* --- 국가 필터 제어 --- */
        function setCountryFilter(countryCode) {
            currentCountryFilter = countryCode;
            
            // UI 버튼 활성화 처리
            const buttons = document.querySelectorAll('.country-filter-container .filter-btn');
            buttons.forEach(btn => {
                if (btn.innerText === countryMap[countryCode]) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // 필터 라벨 업데이트
            document.getElementById('currentFilterLabel').innerText = `필터: ${countryMap[countryCode]}`;

            // 화면 갱신 (티어보드와 대기열 모두 필터 적용)
            renderTiers();
            renderPool();
        }

        // 영화 리스트 필터링 유틸
        function getFilteredMovies(movieList) {
            if (currentCountryFilter === 'ALL') return movieList;
            return movieList.filter(m => m.country === currentCountryFilter);
        }

        // 티어보드 렌더링
        function renderTiers() {
            const board = document.getElementById('tierBoard');
            board.innerHTML = '';

            tiers.forEach(tier => {
                const row = document.createElement('div');
                row.className = 'tier-row';
                
                const label = document.createElement('div');
                label.className = 'tier-label';
                label.style.backgroundColor = tier.color;
                label.innerText = tier.name;
                label.onclick = () => openTierEditModal(tier.id);
                
                const moviesContainer = document.createElement('div');
                moviesContainer.className = 'tier-movies';
                
                // 해당 티어 영화 중, 현재 국가 필터에 맞는 영화만 렌더링
                let tierMovies = movies.filter(m => m.tierId === tier.id);
                tierMovies = getFilteredMovies(tierMovies);

                tierMovies.forEach(movie => {
                    moviesContainer.appendChild(createMovieElement(movie, true));
                });

                row.appendChild(label);
                row.appendChild(moviesContainer);
                board.appendChild(row);
            });
        }

        // 대기열 렌더링
        function renderPool() {
            const pool = document.getElementById('moviePool');
            pool.innerHTML = '';
            
            // 대기열 영화 중, 현재 국가 필터에 맞는 영화만 렌더링
            let poolMovies = movies.filter(m => !m.tierId);
            poolMovies = getFilteredMovies(poolMovies);

            if (poolMovies.length === 0) {
                pool.innerHTML = '<div style="color: #666; font-size: 0.9rem; padding: 10px;">해당 국가에 해당하는 영화가 없습니다.</div>';
            }

            poolMovies.forEach(movie => {
                pool.appendChild(createMovieElement(movie, false));
            });
        }

        // 영화 엘리먼트 생성
        function createMovieElement(movie, isInTier) {
            const el = document.createElement('div');
            el.className = 'movie-item';
            
            if (movie.poster) {
                el.style.backgroundImage = `url('${movie.poster}')`;
            } else {
                const fallback = document.createElement('div');
                fallback.className = 'movie-title-fallback';
                fallback.innerText = movie.title;
                el.appendChild(fallback);
            }

            // 국가 뱃지 추가
            const badge = document.createElement('div');
            badge.className = 'country-badge';
            badge.innerText = countryMap[movie.country] || movie.country;
            el.appendChild(badge);

            // 클릭 이벤트 분기
            el.onclick = () => {
                currentSelectedMovieId = movie.id;
                if (isInTier) {
                    openReviewModal(movie);
                } else {
                    openTierSelectModal(movie);
                }
            };
            return el;
        }

        // 임시 영화 검색 기능 (랜덤 국가 부여)
        function searchMovie() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const newId = 'm_' + Date.now();
            
            // 데모용: 랜덤하게 국가 하나 지정
            const countryCodes = ['KR', 'US', 'GB', 'JP', 'CN', 'TW'];
            const randomCountry = countryCodes[Math.floor(Math.random() * countryCodes.length)];

            const mockMovie = {
                id: newId,
                title: query,
                poster: `https://via.placeholder.com/160x240/333333/ffffff?text=${encodeURIComponent(query)}`,
                tierId: null, 
                rating: '3',
                target: '',
                comment: '',
                country: randomCountry
            };

            movies.push(mockMovie);
            document.getElementById('searchInput').value = '';
            
            // 새 영화 검색 시 전체 필터로 이동
            setCountryFilter('ALL');
            
            showToast(`'${query}' (${countryMap[randomCountry]}) 영화가 대기열에 추가되었습니다.`);
        }

        /* --- 모달 및 토스트 제어 --- */
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'flex';
        }
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // 1. 티어 선택 모달
        function openTierSelectModal(movie) {
            document.getElementById('tierSelectTitle').innerText = `'${movie.title}' 배치하기`;
            
            const btnContainer = document.getElementById('tierSelectButtons');
            btnContainer.innerHTML = '';
            
            tiers.forEach(tier => {
                const btn = document.createElement('button');
                btn.className = 'tier-select-btn';
                btn.style.backgroundColor = tier.color;
                btn.innerText = tier.name;
                btn.onclick = () => assignTier(movie.id, tier.id);
                btnContainer.appendChild(btn);
            });
            
            openModal('tierSelectModal');
        }

        function assignTier(movieId, tierId) {
            const movie = movies.find(m => m.id === movieId);
            if (movie) {
                movie.tierId = tierId;
                renderPool();
                renderTiers();
            }
            closeModal('tierSelectModal');
        }

        // 2. 리뷰 모달
        function openReviewModal(movie) {
            document.getElementById('reviewMovieTitle').innerText = movie.title;
            document.getElementById('reviewRating').value = movie.rating || '3';
            document.getElementById('reviewTarget').value = movie.target || '';
            document.getElementById('reviewComment').value = movie.comment || '';
            
            openModal('reviewModal');
        }

        function saveReview() {
            const movie = movies.find(m => m.id === currentSelectedMovieId);
            if (movie) {
                movie.rating = document.getElementById('reviewRating').value;
                movie.target = document.getElementById('reviewTarget').value;
                movie.comment = document.getElementById('reviewComment').value;
                showToast("평가가 저장되었습니다.");
            }
            closeModal('reviewModal');
        }

        function moveToPool() {
            const movie = movies.find(m => m.id === currentSelectedMovieId);
            if (movie) {
                movie.tierId = null;
                renderTiers();
                renderPool();
                showToast("대기열로 이동되었습니다.");
            }
            closeModal('reviewModal');
        }

        // 3. 티어 편집 모달
        function openTierEditModal(tierId) {
            currentSelectedTierId = tierId;
            const tier = tiers.find(t => t.id === tierId);
            if (tier) {
                document.getElementById('editTierName').value = tier.name;
                document.getElementById('editTierColor').value = tier.color;
                openModal('tierEditModal');
            }
        }

        function saveTierEdit() {
            const tier = tiers.find(t => t.id === currentSelectedTierId);
            if (tier) {
                tier.name = document.getElementById('editTierName').value;
                tier.color = document.getElementById('editTierColor').value;
                renderTiers();
            }
            closeModal('tierEditModal');
        }

        // 4. 국가 건의 모달
        function openCountrySuggestModal() {
            document.getElementById('suggestCountryInput').value = '';
            openModal('countrySuggestModal');
        }

        function submitCountrySuggest() {
            const country = document.getElementById('suggestCountryInput').value.trim();
            if (!country) {
                alert("국가명을 입력해 주세요.");
                return;
            }
            
            // 실제 구현에서는 서버 API 호출
            console.log(`새 국가 건의 접수됨: ${country}`);
            showToast(`'${country}' 건의가 정상적으로 접수되었습니다!`);
            closeModal('countrySuggestModal');
        }

        // 초기 실행
        window.onload = init;
    </script>
</body>
</html>
